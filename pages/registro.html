<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivero Raiz - Registro</title>
    <link rel="stylesheet" href="../estilos/style.css" type="text/css">
</head>

<body>
    <header class="cabecera">
        <div>
            <a class="cabecera-logo" href="../index.html">
                <img src="../img/logo.png" alt="Logo">
                <h1 class="cabecera-title">Vivero Raiz</h1>
                <p class="cabecera-subtitle">Desde 1998</p>
            </a>
        </div>
        <div>
            <ul class="cabecera-options">
                <li><a href="../pages/catalogo.html">CATALOGO</a></li>
                <li><a href="../pages/nosotros.html">NOSOTROS</a></li>
                <li><a href="../pages/contacto.html">CONTACTO</a></li>
                <li><a href="../pages/login.html">INGRESAR</a></li>
            </ul>
        </div>
    </header>
    <main>

        <div class="container">
            <div class="imagen">
                <img alt="imagen-lateral" src="../img/vivero_home_2.jpg" />
            </div>
            <div class="formulario">
                <h1>Crear cuenta</h1>
                <p>Los campos marcados con * son obligatorios.</p>
                <form action="#" target="_self" autocomplete="on">
                    <fieldset class="form-set-1">
                        <legend>DATOS PERSONALES</legend>
                        <div class="form-box">
                            <label for="fname">NOMBRE *</label>
                            <br />
                            <input class="text-input" type="text" id="fname" name="fname" />
                        </div>
                        <div class="form-box">
                            <label for="lname">APELLIDO *</label>
                            <br />
                            <input class="text-input" type="text" id="lname" name="lname" />
                        </div>
                        <div class="form-box">
                            <label for="bdate">FECHA DE NACIMIENTO</label>
                            <br />
                            <input class="text-input" type="date" id="bdate" name="bdate" />
                        </div>
                        <div class="form-box">
                            <label for="phone">TELÉFONO</label>
                            <br />
                            <input class="text-input" type="email" id="phone" name="phone" />
                        </div>
                    </fieldset>
                    <fieldset class="form-set-1">
                        <legend>DATOS DE LA CUENTA</legend>
                        <div class="form-box">
                            <label for="email">CORREO ELECTRÓNICO *</label>
                            <br />
                            <input class="text-input" type="email" id="email" name="email" />
                        </div>
                        <div class="form-box">
                            <label for="pwd">CONTRASEÑA *</label>
                            <br />
                            <input class="text-input" type="password" id="pwd" name="pwd" />
                        </div>
                        <div class="form-box">
                            <label for="pwd2">REPETIR CONTRASEÑA *</label>
                            <br />
                            <input class="text-input" type="password" id="pwd2" name="pwd2" />
                        </div>
                    </fieldset>
                    <div class="form-box">
                        <label for="roles">ROL EN EL VIVERO *</label>
                        <select class="desplegable" id="roles" name="roles">
                            <option value="">Elegí una opción</option>
                            <option value="vendedor">Vendedor</option>
                            <option value="repartidor">Repartidor</option>
                            <option value="catalogador">Catalogador</option>
                        </select>
                    </div>
                    <div class="form-box">
                        <input class="form-bottom" type="submit" value="CREAR CUENTA" />
                    </div>
                </form>
                <div class="links-container">
                    <p class="left">¿Ya tenés cuenta? <a href="./login.html">Ingresá</a></p>
                </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>
</body>

</html>
