<!DOCTYPE html>
<html lang="es">

<head>
    <title>Vivero Raíz - Ingresar</title>
    <link rel="stylesheet" href="../estilos/style.css" type="text/css">
</head>

<body>
    <div class="container">
        <div class="imagen">
            <img alt="imagen-lateral" src="../img/vivero_home.jpg" />
        </div>
        <div class="formulario">
            <h1>Ingresar</h1>
            <p>Usá la cuenta que dio el vivero.</p>
            <form action="#" target="_self" autocomplete="on">
                <label>El correo o la contraseña no coinciden. Probá de nuevo.</label>
                <br />
                <label for="email">CORREO ELECTRÓNICO</label>
                <br />
                <input type="email" id="email" name="email" />
                <br />
                <label>Ejemplo: username@dominio.com</label>
                <br />
                <label for="pwd">CONTRASEÑA</label>
                <br />
                <input type="password" id="pwd" name="pwd" />
                <br />
                <input type="checkbox" id="check" name="check" />
                <label for="check">Mantener la sesión iniciada</label>
                <br />
                <input type="submit" value="INGRESAR" />
            </form>
            <p><a href="#">¿Olvidaste tu contraseña?</a></p>
            <p>¿No tenés cuenta? <a href="#">Registrate</a></p>
        </div>
    </div>
</body>

</html>
