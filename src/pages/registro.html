<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivero Raiz - Registro</title>
    <link rel="stylesheet" href="../estilos/style.css" type="text/css">
</head>

<body>
    <div class="container">
        <div class="imagen">
            <img alt="imagen-lateral" src="../img/vivero_home_2.jpg" />
        </div>
        <div class="formulario">
            <h1>Crear cuenta</h1>
            <p>Los campos marcados con * son obligatorios.</p>
            <form action="#" target="_self" autocomplete="on">
                <fieldset class="form-set-1">
                    <legend>DATOS PERSONALES</legend>
                    <div class="form-box">
                        <label for="email">NOMBRE *</label>
                        <br />
                        <input class="text-input" type="email" id="email" name="email" />
                    </div>
                    <div class="form-box">
                        <label for="email">APELLIDO *</label>
                        <br />
                        <input class="text-input" type="email" id="email" name="email" />
                    </div>
                    <div class="form-box">
                        <label for="email">FECHA DE NACIMIENTO</label>
                        <br />
                        <input class="text-input" type="email" id="email" name="email" />
                    </div>
                    <div class="form-box">
                        <label for="email">TELÉFONO</label>
                        <br />
                        <input class="text-input" type="email" id="email" name="email" />
                    </div>
                </fieldset>
                <fieldset class="form-set-1">
                    <legend>DATOS DE LA CUENTA</legend>
                    <div class="form-box">
                        <label for="email">CORREO ELECTRÓNICO *</label>
                        <br />
                        <input class="text-input" type="email" id="email" name="email" />
                    </div>
                    <div class="form-box">
                        <label for="email">CONTRASEÑA *</label>
                        <br />
                        <input class="text-input" type="email" id="email" name="email" />
                    </div>
                    <div class="form-box">
                        <label for="email">REPETIR CONTRASEÑA *</label>
                        <br />
                        <input class="text-input" type="email" id="email" name="email" />
                    </div>
                </fieldset>
                <div class="form-box">
                    <label>ROL EN EL VIVERO *</label>
                    <select class="desplegable" id="roles" name="roles">
                        <option value="volvo">Volvo</option>
                        <option value="saab">Saab</option>
                        <option value="fiat">Fiat</option>
                        <option value="audi">Audi</option>
                    </select>
                </div>
                <div class="form-box">
                    <input class="form-bottom" type="submit" value="CREAR CUENTA" />
                </div>
            </form>
            <div class="links-container">
                <p class="left">¿Ya tenés cuenta? <a href="./login.html">Ingresá</a></p>
            </div>
        </div>
    </div>
</body>

</html>
